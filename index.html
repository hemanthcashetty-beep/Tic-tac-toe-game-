<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Shop</h1>
    <button id="cartButton">Cart: <span id="cartCount">0</span></button>
  </header>

  <main>
    <h2>Products</h2>

    <section class="products">
      <div class="product">
        <img src="https://via.placeholder.com/250x180" alt="T-Shirt">
        <h3>Cool T-Shirt</h3>
        <p>$20</p>
        <button onclick="addToCart('Cool T-Shirt', 20)">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://via.placeholder.com/250x180" alt="Shoes">
        <h3>Running Shoes</h3>
        <p>$50</p>
        <button onclick="addToCart('Running Shoes', 50)">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://via.placeholder.com/250x180" alt="Watch">
        <h3>Smart Watch</h3>
        <p>$75</p>
        <button onclick="addToCart('Smart Watch', 75)">Add to Cart</button>
      </div>
    </section>

    <section id="cart">
      <h2>Your Cart</h2>
      <ul id="cartItems"></ul>
      <h3>Total: $<span id="total">0</span></h3>
      <button id="checkout">Checkout</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
